name: Verify Space switcher clear button

on:
  push:
    branches:
      - dev

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.20.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Apply minimal clear-button inset fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/app/space-switcher.css")
          text = path.read_text()
          anchor = '''\n:is(\n  [data-slot="combobox-content"][aria-label="Change space"],\n  [data-slot="combobox-content"][aria-label="Alterar espaço"]\n) > [data-slot="input-group"] [data-slot="input-group-addon"] {\n  padding: 0;\n}\n'''
          addition = anchor + '''\n:is(\n  [data-slot="combobox-content"][aria-label="Change space"],\n  [data-slot="combobox-content"][aria-label="Alterar espaço"]\n) > [data-slot="input-group"] [data-slot="input-group-addon"][data-align="inline-end"]:has(> button) {\n  margin-right: 0;\n}\n'''
          if anchor not in text:
              raise SystemExit("Expected Space switcher addon rule was not found")
          path.write_text(text.replace(anchor, addition, 1))
          PY
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Run regression
        shell: bash
        run: |
          pnpm dev > /tmp/notes-app-next.log 2>&1 &
          for i in {1..60}; do
            if curl --fail --silent http://localhost:3000 >/dev/null; then
              break
            fi
            sleep 1
          done
          pnpm exec playwright test tests/space-switcher-clear-button.spec.ts --reporter=line
      - run: pnpm lint
      - name: Commit verified fix and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/verify-space-switcher-clear.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/space-switcher.css .github/workflows/verify-space-switcher-clear.yml
          git commit -m "fix: align Space switcher clear button inset"
          git push origin HEAD:dev
