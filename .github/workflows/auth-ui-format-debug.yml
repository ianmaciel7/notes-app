name: Auth UI Format Debug

on:
  push:
    branches:
      - chore/auth-ui-format

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: ".node-version"
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - run: pnpm install --frozen-lockfile
      - name: Apply Biome fixes in runner
        run: pnpm exec biome check --write --unsafe src/components/notes-app || true
      - name: Emit formatted files
        shell: bash
        run: |
          find src/components/notes-app -type f -name '*.tsx' -print0 | sort -z | while IFS= read -r -d '' f; do
            printf 'AUTH_UI_FILE::%s::' "$f"
            base64 -w0 "$f"
            printf '\n'
          done
      - name: Show remaining Biome diagnostics
        run: pnpm exec biome check --max-diagnostics=500 src/components/notes-app || true
