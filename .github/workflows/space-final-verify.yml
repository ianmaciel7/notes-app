name: Final Space architecture verification

on:
  push:
    branches:
      - feat/space-scoped-data-architecture

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/space-scoped-data-architecture
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 11.20.0
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Unit tests
        run: pnpm test:unit

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Start production app
        run: |
          pnpm start > /tmp/notes-app.log 2>&1 &
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:3000 >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/notes-app.log
          exit 1

      - name: Space browser regression
        run: |
          pnpm exec playwright test \
            tests/space-create-state.spec.ts \
            tests/space-isolation.spec.ts \
            tests/space-switcher-parity.spec.ts \
            tests/space-switcher-clear-button.spec.ts \
            tests/space-switcher-phantom-addon.spec.ts

      - name: Audit Space-owned access
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          import sys

          table = r"(?:objectTypes|entities|collections|tags|relations|media|spaceSettings|trash)"
          unsafe_get = re.compile(rf"(?:db|database)\.{table}\.get\((?!\s*\[)")
          bad = []
          for path in Path("src").rglob("*"):
              if path.suffix not in {".ts", ".tsx"} or ".test." in path.name:
                  continue
              text = path.read_text()
              for match in unsafe_get.finditer(text):
                  line = text.count("\n", 0, match.start()) + 1
                  bad.append(f"{path}:{line}: Space-owned get() missing compound [spaceId,id] key")

          state_pattern = re.compile(
              r"useState[^\n]*(?:spaces|objectTypes|createdEntities|objectTypeCollections|trashItems|media)",
              re.IGNORECASE,
          )
          for path in [Path("src/components/workspace-controller.tsx"), Path("src/hooks/use-space-data.ts")]:
              text = path.read_text()
              for match in state_pattern.finditer(text):
                  line = text.count("\n", 0, match.start()) + 1
                  bad.append(f"{path}:{line}: persistent domain data stored authoritatively in React useState")

          if bad:
              print("\n".join(bad))
              sys.exit(1)

          print("Space access audit passed")
          PY

      - name: Ensure generated results are not tracked
        run: |
          if git ls-files test-results | grep -q .; then
            echo "Generated Playwright test-results are tracked"
            git ls-files test-results
            exit 1
          fi
