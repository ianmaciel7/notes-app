name: Verify Space architecture

on:
  push:
    branches:
      - feat/space-scoped-data-architecture

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/space-scoped-data-architecture
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 11.20.0
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install existing dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Add local-first persistence dependencies
        run: |
          pnpm add dexie dexie-react-hooks
          pnpm add -D vitest fake-indexeddb
          node - <<'NODE'
          const fs = require("node:fs");
          const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
          pkg.scripts["test:unit"] = "vitest run";
          fs.writeFileSync("package.json", `${JSON.stringify(pkg, null, 2)}\n`);
          NODE

      - name: Apply compatibility type fixes
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          sidebar = Path("src/components/app-sidebar.tsx")
          text = sidebar.read_text()
          old = '(props: React.ComponentProps<"svg">) => ('
          count = text.count(old)
          if count != 2:
              raise SystemExit(f"expected 2 Space icon SVG prop sites, found {count}")
          sidebar.write_text(text.replace(old, '(props: Omit<React.ComponentProps<"svg">, "name">) => ('))

          repository = Path("src/lib/spaces/space-repository.ts")
          text = repository.read_text()
          pattern = re.compile(
              r'await database\.transaction\(\s*"rw",\s*'
              r'database\.spaces,\s*database\.appSettings,\s*database\.objectTypes,\s*'
              r'database\.entities,\s*database\.collections,\s*database\.tags,\s*'
              r'database\.relations,\s*database\.media,\s*database\.spaceSettings,\s*'
              r'database\.trash,\s*async \(\) => \{',
              re.MULTILINE,
          )
          replacement = '''await database.transaction(
              "rw",
              [
                database.spaces,
                database.appSettings,
                database.objectTypes,
                database.entities,
                database.collections,
                database.tags,
                database.relations,
                database.media,
                database.spaceSettings,
                database.trash,
              ],
              async () => {'''
          updated, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit(f"expected one Dexie deleteSpace transaction block, found {count}")
          repository.write_text(updated)
          PY

      - name: Format changed implementation files
        run: |
          pnpm exec biome format --write \
            src/types/schema.ts \
            src/lib/db.ts \
            src/lib/spaces/space-types.ts \
            src/lib/spaces/space-repository.ts \
            src/lib/spaces/personal-space-seed.ts \
            src/lib/spaces/bootstrap-workspace.ts \
            src/lib/spaces/space-projections.ts \
            src/lib/db.test.ts \
            src/lib/spaces/space-repository.test.ts \
            src/lib/spaces/bootstrap-workspace.test.ts \
            src/lib/spaces/space-projections.test.ts \
            src/hooks/use-space-data.ts \
            src/components/workspace-object-type-presenter.ts \
            src/components/workspace-controller.tsx \
            src/components/app-sidebar.tsx \
            tests/space-isolation.spec.ts \
            vitest.config.ts

      - name: Unit tests
        run: pnpm test:unit

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Start production app
        run: |
          pnpm start > /tmp/notes-app.log 2>&1 &
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:3000 >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/notes-app.log
          exit 1

      - name: Space browser regression
        run: |
          pnpm exec playwright test \
            tests/space-create-state.spec.ts \
            tests/space-isolation.spec.ts \
            tests/space-switcher-parity.spec.ts \
            tests/space-switcher-clear-button.spec.ts \
            tests/space-switcher-phantom-addon.spec.ts

      - name: Audit Space-owned reads and React state
        run: |
          echo "Space-owned Dexie reads:"
          rg "db\.(objectTypes|entities|collections|tags|relations|media|spaceSettings|trash)" src || true
          echo "Potential authoritative React domain state:"
          rg "useState.*(spaces|objectTypes|createdEntities|objectTypeCollections|trashItems|media)" src/components src/hooks || true

      - name: Commit verified dependency lock and formatting
        if: success()
        run: |
          rm .github/workflows/space-architecture-verify.yml
          git config user.name "Ian Maciel"
          git config user.email "ianmaciel76@gmail.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No final generated changes to commit"
          else
            git commit -m "feat: finalize Space-scoped local data architecture"
            git push origin HEAD:feat/space-scoped-data-architecture
          fi
