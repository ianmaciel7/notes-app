name: Verify Space switcher structural fix

on:
  push:
    branches:
      - dev

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.20.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Run Space switcher regressions
        shell: bash
        run: |
          pnpm dev > /tmp/notes-app-next.log 2>&1 &
          for i in {1..60}; do
            if curl --fail --silent http://localhost:3000 >/dev/null; then
              break
            fi
            sleep 1
          done
          pnpm exec playwright test tests/space-switcher-clear-button.spec.ts tests/space-switcher-phantom-addon.spec.ts --reporter=line
      - run: pnpm lint
      - name: Remove temporary workflow
        if: success()
        shell: bash
        run: |
          rm .github/workflows/verify-space-switcher-phantom-final.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/verify-space-switcher-phantom-final.yml
          git commit -m "chore: remove Space switcher verification workflow"
          git push origin HEAD:dev
