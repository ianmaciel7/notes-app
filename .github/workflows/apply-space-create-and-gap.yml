name: Apply Space creation and gap fix

on:
  push:
    branches:
      - fix/create-space-and-switcher-spacing

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/create-space-and-switcher-spacing
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.20.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Apply minimal production changes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          controller = Path("src/components/workspace-controller.tsx")
          text = controller.read_text()
          anchor = "  const openInSidePanel = React.useCallback(\n"
          replacement = """  const createSpace = React.useCallback((name: string) => {
            const normalizedName = name.trim();
            if (!normalizedName) return;

            const id = `space-${crypto.randomUUID()}`;
            setSpaces((current) => [...current, { id, name: normalizedName, icon: \"user\" }]);
            setSpaceId(id);
          }, []);

          const openInSidePanel = React.useCallback(
          """
          if anchor not in text:
              raise SystemExit("workspace createSpace insertion anchor not found")
          text = text.replace(anchor, replacement, 1)

          value_anchor = "      setSpaces,\n      switchSpace: setSpaceId,\n"
          value_replacement = "      setSpaces,\n      createSpace,\n      switchSpace: setSpaceId,\n"
          if value_anchor not in text:
              raise SystemExit("workspace value anchor not found")
          text = text.replace(value_anchor, value_replacement, 1)

          deps_anchor = "      spaces,\n      spaceId,\n      mainTabs,\n"
          deps_replacement = "      spaces,\n      spaceId,\n      createSpace,\n      mainTabs,\n"
          if deps_anchor not in text:
              raise SystemExit("workspace dependency anchor not found")
          text = text.replace(deps_anchor, deps_replacement, 1)
          controller.write_text(text)

          css = Path("src/app/space-switcher.css")
          css_text = css.read_text()
          css_anchor = ") [data-space-sort-id] {\n  min-height: 2rem;\n"
          css_replacement = ") [data-space-sort-id] {\n  min-height: 2rem;\n  column-gap: 0.5rem;\n"
          if css_anchor not in css_text:
              raise SystemExit("Space row CSS anchor not found")
          css.write_text(css_text.replace(css_anchor, css_replacement, 1))
          PY
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Run Space switcher regressions
        shell: bash
        run: |
          pnpm dev > /tmp/notes-app-next.log 2>&1 &
          for i in {1..60}; do
            if curl --fail --silent http://localhost:3000 >/dev/null; then
              break
            fi
            sleep 1
          done
          pnpm exec playwright test \
            tests/space-create-and-spacing.spec.ts \
            tests/space-switcher-clear-button.spec.ts \
            tests/space-switcher-phantom-addon.spec.ts \
            --reporter=line
      - run: pnpm lint
      - name: Commit verified changes and remove temporary workflows
        shell: bash
        run: |
          rm -f .github/workflows/verify-space-create-and-spacing.yml
          rm -f .github/workflows/apply-space-create-and-gap.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/workspace-controller.tsx src/app/space-switcher.css tests/space-create-and-spacing.spec.ts .github/workflows
          git commit -m 'fix: create and select Spaces from the switcher'
          git push origin HEAD:fix/create-space-and-switcher-spacing
