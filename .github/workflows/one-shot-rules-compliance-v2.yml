name: One-shot rules compliance v2

on:
  push:
    branches: [dev]
    paths:
      - .github/workflows/one-shot-rules-compliance-v2.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout dev
        uses: actions/checkout@v6
        with:
          ref: dev
          fetch-depth: 0

      - name: Apply audited compliance patch
        shell: python
        run: |
          from pathlib import Path
          import re
          import textwrap

          workflow = Path('.github/workflows/one-shot-rules-compliance.yml').read_text(encoding='utf-8')
          match = re.search(
              r'      - name: Apply compliance fixes\n        shell: python\n        run: \|\n(.*?)\n      - name: Setup pnpm',
              workflow,
              re.S,
          )
          if not match:
              raise SystemExit('Could not locate audited compliance patch')
          script = textwrap.dedent(match.group(1))
          exec(compile(script, '<rules-compliance>', 'exec'))

          def replace(path, old, new, count=1):
              file = Path(path)
              text = file.read_text(encoding='utf-8')
              if text.count(old) < count:
                  raise SystemExit(f'Missing expected source in {path}: {old[:80]!r}')
              file.write_text(text.replace(old, new, count), encoding='utf-8')

          content = 'src/components/workspace-content.tsx'
          replace(
              content,
              '        <label\n          key={key}\n          data-slot="object-type-named-card"',
              '        <div\n          key={key}\n          data-slot="object-type-named-card"',
          )
          replace(content, '        </label>\n      ))}', '        </div>\n      ))}')

          controller = 'src/components/workspace-controller.tsx'
          replace(
              controller,
              '      pinnedEntities,\n      objectTypes,\n      workspaceObjects.structures,',
              '      pinnedEntities,\n      availablePinnedEntities,\n      objectTypes,\n      workspaceObjects.structures,',
          )

          slash = 'src/editor/slash-command.tsx'
          replace(
              slash,
              '        aria-activedescendant={\n          activeItem ? `block-editor-slash-option-${activeItem.id}` : undefined\n        }\n        className=',
              '        aria-activedescendant={\n          activeItem ? `block-editor-slash-option-${activeItem.id}` : undefined\n        }\n        tabIndex={0}\n        className=',
          )

          overview = 'src/components/app-sidebar-overview.tsx'
          replace(overview, '  ObjectIconBadge,\n  ObjectPageIcon,\n', '  ObjectIconBadge,\n')

          for path in [
              'src/components/block-editor-handle.tsx',
              'src/components/block-editor-selection-toolbar.tsx',
          ]:
              replace(
                  path,
                  'import { createBlockCommandCatalog } from "@/editor/block-command-catalog";',
                  'import type { createBlockCommandCatalog } from "@/editor/block-command-catalog";',
              )

          replace(
              'src/lib/workspace-sidebar-pinned-storage.ts',
              'import { type ObjectIconTone } from "./workspace-object-types";',
              'import type { ObjectIconTone } from "./workspace-object-types";',
          )
          replace(
              'tests/block-editor-contract.test.mjs',
              '  globalsSource,\n  handleReferenceImage,',
              '  _globalsSource,\n  handleReferenceImage,',
          )

          Path('.github/workflows/one-shot-rules-compliance-v2.yml').unlink()

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify repository
        run: pnpm verify

      - name: Commit verified compliance fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: enforce repository rules compliance"
          git push origin HEAD:dev
