name: Export feature source

on:
  push:
    branches:
      - 868hpfrkz-implement-all-pending-openspecs
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Upload source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: notes-app-source-${{ github.sha }}
          path: |
            .
            !.git
            !node_modules
          include-hidden-files: true
          retention-days: 1
