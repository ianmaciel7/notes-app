name: Repair object page parity transformer

on:
  push:
    branches:
      - codex/align-object-page-complete-parity

permissions:
  contents: write

concurrency:
  group: repair-object-page-parity-transformer
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out delivery branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Repair ambiguous document menu marker and push
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/scripts/apply-object-page-parity.py')
          text = path.read_text(encoding='utf-8')

          source_old = (
              "'''          <DocumentMoreMenu\n"
              '            onChangeType={() => showMessage(t("documentMenu.changeType"))}\n'
              "'''"
          )
          source_new = (
              "'''        menu={\n"
              "          <DocumentMoreMenu\n"
              '            onChangeType={() => showMessage(t("documentMenu.changeType"))}\n'
              "            onCustomize={() => setCustomizeOpen(true)}\n"
              "'''"
          )
          replacement_old = (
              "'''          <DocumentMoreMenu\n"
              "            isPinned={isPinned}\n"
              "            onChangeType={() =>\n"
              "              setTypeActivationRequest((current) => current + 1)\n"
              "            }\n"
              "'''"
          )
          replacement_new = (
              "'''        menu={\n"
              "          <DocumentMoreMenu\n"
              "            isPinned={isPinned}\n"
              "            onChangeType={() =>\n"
              "              setTypeActivationRequest((current) => current + 1)\n"
              "            }\n"
              "            onCustomize={() => setCustomizeOpen(true)}\n"
              "'''"
          )

          if source_old in text and replacement_old in text:
              if text.count(source_old) != 1:
                  raise SystemExit(
                      f'Expected one source menu marker, found {text.count(source_old)}'
                  )
              if text.count(replacement_old) != 1:
                  raise SystemExit(
                      f'Expected one replacement menu marker, found {text.count(replacement_old)}'
                  )
              text = text.replace(source_old, source_new, 1)
              text = text.replace(replacement_old, replacement_new, 1)
              path.write_text(text, encoding='utf-8')
          elif source_new in text and replacement_new in text:
              print('Document menu marker is already repaired.')
          else:
              raise SystemExit(
                  'Document menu marker was not found; source=' 
                  f'{text.count(source_old)}, replacement={text.count(replacement_old)}'
              )
          PY

          python -m py_compile .github/scripts/apply-object-page-parity.py
          if git diff --quiet -- .github/scripts/apply-object-page-parity.py; then
            exit 0
          fi

          git config user.name 'Ian Maciel'
          git config user.email 'ianmaciel76@gmail.com'
          git add .github/scripts/apply-object-page-parity.py
          git commit -m 'fix: disambiguate document menu transformer marker'
          git push origin HEAD:codex/align-object-page-complete-parity
