name: One-shot rules compliance

on:
  push:
    branches: [dev]
    paths:
      - .github/workflows/one-shot-rules-compliance.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout dev
        uses: actions/checkout@v6
        with:
          ref: dev
          fetch-depth: 0

      - name: Apply compliance fixes
        shell: python
        run: |
          from pathlib import Path
          import json
          import re

          def sub(path, pattern, replacement, count=1, flags=0):
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              next_text, matches = re.subn(pattern, replacement, text, count=count, flags=flags)
              if matches != count:
                  raise SystemExit(f"Expected {count} match(es) in {path}, found {matches}: {pattern[:100]!r}")
              file.write_text(next_text, encoding="utf-8")

          controller = "src/components/workspace-controller.tsx"
          sub(
              controller,
              r'const initialMainTabs: AppHeaderTab\[\] = \[.*?const specialSideTabs: Record<.*?\n};\n\ntype ParsedCollectionPinnedId',
              'const MAIN_DRAFT_TAB_ID = "new-tab-draft";\n\ntype ParsedCollectionPinnedId',
              flags=re.S,
          )
          sub(
              controller,
              r'  const \[mainTabs, setMainTabs\] = React\.useState\(initialMainTabs\);\n  const \[mainValue, setMainValue\] = React\.useState\("untitled"\);\n  const \[sideTabs, setSideTabs\] = React\.useState\(initialSideTabs\);',
              '''  const [mainTabs, setMainTabs] = React.useState<AppHeaderTab[]>(() => [
              {
                id: "atomic-note",
                label: t("tabs.initialAtomicNotes"),
                icon: ObjectAtomicNoteIcon,
                iconClassName: objectIconToneBadgeClass.amber,
                preview: <TabPreview eyebrow={t("tabs.initialObjectType")} title={t("tabs.initialAtomicNotes")} />,
              },
              {
                id: "quote",
                label: t("tabs.initialQuotes"),
                icon: ObjectQuoteIcon,
                iconClassName: objectIconToneBadgeClass.rose,
                preview: <TabPreview eyebrow={t("tabs.initialObjectType")} title={t("tabs.initialQuotes")} />,
              },
              {
                id: "page",
                label: t("tabs.initialPages"),
                icon: ObjectPageIcon,
                iconClassName: objectIconToneBadgeClass.blue,
                preview: <TabPreview eyebrow={t("tabs.initialObjectType")} title={t("tabs.initialPages")} />,
              },
              {
                id: "untitled",
                label: t("lifecycle.untitled"),
                icon: ObjectQuoteIcon,
                iconClassName: objectIconToneBadgeClass.rose,
                preview: <TabPreview eyebrow={t("objects.quote")} title={t("lifecycle.untitled")} />,
              },
            ]);
            const [mainValue, setMainValue] = React.useState("untitled");
            const [sideTabs, setSideTabs] = React.useState<AppHeaderTab[]>(() => [
              {
                id: "explore",
                label: t("primaryNavigation.explore"),
                icon: AppHeaderCompassIcon,
                iconClassName: objectIconToneBadgeClass.gray,
                draggable: false,
              },
            ]);''',
          )
          sub(
              controller,
              r'preview: <TabPreview eyebrow="Objeto" title=\{entity\.label\} />',
              'preview: <TabPreview eyebrow={t("tabs.object")} title={entity.label} />',
          )
          sub(
              controller,
              r'showMessage\("Pinned tabs cannot be closed\. Unpin the tab first\."\);',
              'showMessage(t("tabs.pinnedCloseBlocked"));',
          )
          sub(
              controller,
              r'(function MainTabSearchOverlay\(\) \{.*?const \[query, setQuery\] = React\.useState\(""\);)',
              r'\1\n  const deferredQuery = React.useDeferredValue(query);',
              flags=re.S,
          )
          sub(
              controller,
              r'(function MainTabSearchOverlay\(\).*?)const normalized = query\.trim\(\)\.toLocaleLowerCase\(\);',
              r'\1const normalized = deferredQuery.trim().toLocaleLowerCase();',
              flags=re.S,
          )
          sub(
              controller,
              r'(function WorkspaceSidePanelHeader\(\) \{.*?const \{ toggleRight \} = useAppShell\(\);)',
              r'''\1
            const specialSideTabs: Record<SidePanelSpecialEntryId, Omit<AppHeaderTab, "id">> = {
              graphView: { label: t("explore.graphView"), icon: AppHeaderGraphIcon, iconClassName: objectIconToneBadgeClass.gray },
              backlinks: { label: t("explore.backlinks"), icon: ObjectPageIcon, iconClassName: objectIconToneBadgeClass.gray },
              objectsInside: { label: t("explore.objectsInside"), icon: ObjectAreaIcon, iconClassName: objectIconToneBadgeClass.gray },
              relatedContent: { label: t("explore.relatedContent"), icon: AppHeaderGraphIcon, iconClassName: objectIconToneBadgeClass.gray },
              aiAssistantChat: { label: t("explore.aiChat"), icon: ObjectAiChatIcon, iconClassName: objectIconToneBadgeClass.purple },
              localSpaceQuery: { label: t("actions.search"), icon: ObjectQueryIcon, iconClassName: objectIconToneBadgeClass.emerald },
            };''',
              flags=re.S,
          )
          sub(
              controller,
              r'    if \(!explore\) \{\n      const nextExplore = initialSideTabs\.find\(\(tab\) => tab\.id === "explore"\);\n      if \(!nextExplore\) return;\n\n      setSideTabs\(\(current\) => \[\.\.\.current, nextExplore\]\);\n      setSideValue\(nextExplore\.id\);\n      return;\n    \}',
              '''    if (!explore) {
                const nextExplore: AppHeaderTab = {
                  id: "explore",
                  label: t("primaryNavigation.explore"),
                  icon: AppHeaderCompassIcon,
                  iconClassName: objectIconToneBadgeClass.gray,
                  draggable: false,
                };
                setSideTabs((current) => [...current, nextExplore]);
                setSideValue(nextExplore.id);
                return;
              }''',
          )
          sub(
              controller,
              r'(function SidePanelSearchOverlay\(\) \{.*?const \[query, setQuery\] = React\.useState\(""\);)',
              r'\1\n  const deferredQuery = React.useDeferredValue(query);',
              flags=re.S,
          )
          sub(
              controller,
              r'(function SidePanelSearchOverlay\(\).*?)const normalized = query\.trim\(\)\.toLocaleLowerCase\(\);',
              r'\1const normalized = deferredQuery.trim().toLocaleLowerCase();',
              flags=re.S,
          )
          sub(
              controller,
              r'function TabPreview\(\{ eyebrow, title \}: \{ eyebrow: string; title: string \}\) \{\n  return \(\n    <div className="flex flex-col gap-1\.5">\n      <span className="text-xs text-muted-foreground">\{eyebrow\}</span>\n      <span className="font-medium text-foreground">\{title\}</span>\n      <span className="text-sm leading-5 text-muted-foreground">\n        Preview content for \{title\}\.\n      </span>\n    </div>\n  \);\n\}',
              '''function TabPreview({ eyebrow, title }: { eyebrow: string; title: string }) {
            const t = useTranslations("workspace.tabs");
            return (
              <div className="flex flex-col gap-1.5">
                <span className="text-xs text-muted-foreground">{eyebrow}</span>
                <span className="font-medium text-foreground">{title}</span>
                <span className="text-sm leading-5 text-muted-foreground">
                  {t("previewContent", { title })}
                </span>
              </div>
            );
          }''',
          )

          primary = "src/components/app-sidebar-primary-actions.tsx"
          sub(primary, r'\.toLocaleLowerCase\("pt-BR"\);', '.toLocaleLowerCase();')
          sub(
              primary,
              r'  const Icon = action\.icon;\n  const normalizedQuery = normalizeMenuQuery\(query\.trim\(\)\);',
              '''  const Icon = action.icon;
            const deferredQuery = React.useDeferredValue(query);
            const normalizedQuery = normalizeMenuQuery(deferredQuery.trim());''',
          )

          overview = "src/components/app-sidebar-overview.tsx"
          sub(
              overview,
              r'(function AppSidebarSectionMenu\(\{.*?\}\) \{)\n  return \(',
              r'\1\n  const t = useTranslations("workspace.sidebarSections");\n  return (',
              flags=re.S,
          )
          sub(overview, r'aria-label="Ordenar seção"', 'aria-label={t("sort")}')
          sub(overview, r'          Ordenar manualmente', '          {t("manual")}')
          sub(overview, r'          Ordenar alfabeticamente', '          {t("alphabetical")}')

          content = "src/components/workspace-content.tsx"
          sub(
              content,
              r'<input\n\s+ref=\{titleRef\}\n\s+aria-label=\{t\("fields\.title"\)\}\n\s+value=\{title\}\n\s+onChange=\{\(event\) => rename\(event\.target\.value\)\}\n\s+className="mt-3 w-full bg-transparent text-\[40px\] font-bold leading-\[44px\] tracking-\[-0\.02em\] text-\[#282522\] outline-none placeholder:text-\[#b8b2ac\]"\n\s+placeholder=\{t\("objectTypeOverview\.untitled"\)\}\n\s+/>',
              '''<BufferedTextInput
                  inputRef={titleRef}
                  aria-label={t("fields.title")}
                  value={title}
                  onCommit={rename}
                  className="mt-3 w-full bg-transparent text-[40px] font-bold leading-[44px] tracking-[-0.02em] text-[#282522] outline-none placeholder:text-[#b8b2ac]"
                  placeholder={t("objectTypeOverview.untitled")}
                />''',
          )
          sub(
              content,
              r'  const \[query, setQuery\] = React\.useState\(""\);\n  const \[open, setOpen\] = React\.useState\(false\);\n  const visible = suggestions\.filter\(\n    \(item\) =>\n      !collections\.includes\(item\) &&\n      item\.toLocaleLowerCase\(\)\.includes\(query\.trim\(\)\.toLocaleLowerCase\(\)\),\n  \);',
              '''  const [query, setQuery] = React.useState("");
            const deferredQuery = React.useDeferredValue(query);
            const [open, setOpen] = React.useState(false);
            const visible = suggestions.filter(
              (item) =>
                !collections.includes(item) &&
                item.toLocaleLowerCase().includes(deferredQuery.trim().toLocaleLowerCase()),
            );''',
          )
          sub(
              content,
              r'  const \[draft, setDraft\] = React\.useState\(""\);\n  const \[open, setOpen\] = React\.useState\(false\);\n  const visibleSuggestions = suggestions\.filter\(\n    \(tag\) =>\n      !tags\.includes\(tag\) &&\n      tag\.toLocaleLowerCase\(\)\.includes\(draft\.trim\(\)\.toLocaleLowerCase\(\)\),\n  \);',
              '''  const [draft, setDraft] = React.useState("");
            const deferredDraft = React.useDeferredValue(draft);
            const [open, setOpen] = React.useState(false);
            const visibleSuggestions = suggestions.filter(
              (tag) =>
                !tags.includes(tag) &&
                tag.toLocaleLowerCase().includes(deferredDraft.trim().toLocaleLowerCase()),
            );''',
          )
          sub(
              content,
              r'<input\n\s+ref=\{\(node\) => \{\n\s+if \(node\) inputRefs\.current\.set\(index, node\);\n\s+else inputRefs\.current\.delete\(index\);\n\s+\}\}\n\s+aria-label=\{item\}\n\s+value=\{item\}\n\s+onChange=\{\(event\) => onRename\(index, event\.target\.value\)\}\n\s+className="min-w-0 flex-1 truncate bg-transparent text-\[15px\] font-medium leading-5 text-\[#34312f\] outline-none"\n\s+/>',
              '''<BufferedTextInput
                      inputRef={(node) => {
                        if (node) inputRefs.current.set(index, node);
                        else inputRefs.current.delete(index);
                      }}
                      aria-label={item}
                      value={item}
                      onCommit={(value) => onRename(index, value)}
                      className="min-w-0 flex-1 truncate bg-transparent text-[15px] font-medium leading-5 text-[#34312f] outline-none"
                    />''',
          )

          translations = {
              "en": ("Object type", "Atomic notes", "Quotes", "Pages", "Object", "Preview content for {title}.", "Pinned tabs cannot be closed. Unpin the tab first.", "Sort section", "Sort manually", "Sort alphabetically"),
              "pt-BR": ("Tipo de objeto", "Notas atômicas", "Citações", "Páginas", "Objeto", "Conteúdo de pré-visualização para {title}.", "Abas fixadas não podem ser fechadas. Desafixe a aba primeiro.", "Ordenar seção", "Ordenar manualmente", "Ordenar alfabeticamente"),
              "es": ("Tipo de objeto", "Notas atómicas", "Citas", "Páginas", "Objeto", "Vista previa de {title}.", "Las pestañas fijadas no se pueden cerrar. Desfija la pestaña primero.", "Ordenar sección", "Ordenar manualmente", "Ordenar alfabéticamente"),
          }
          for locale, values in translations.items():
              path = Path(f"src/messages/{locale}.json")
              data = json.loads(path.read_text(encoding="utf-8-sig"))
              tabs = data["workspace"]["tabs"]
              for key, value in zip(("initialObjectType", "initialAtomicNotes", "initialQuotes", "initialPages", "object", "previewContent", "pinnedCloseBlocked"), values[:7]):
                  tabs[key] = value
              data["workspace"]["sidebarSections"] = {
                  "sort": values[7],
                  "manual": values[8],
                  "alphabetical": values[9],
              }
              path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")

          Path("tests/rules-compliance-contract.test.mjs").write_text('''import assert from "node:assert/strict";
          import { readFile } from "node:fs/promises";
          import test from "node:test";

          test("workspace rule contracts remain enforced", async () => {
            const [controller, primary, content, overview] = await Promise.all([
              readFile(new URL("../src/components/workspace-controller.tsx", import.meta.url), "utf8"),
              readFile(new URL("../src/components/app-sidebar-primary-actions.tsx", import.meta.url), "utf8"),
              readFile(new URL("../src/components/workspace-content.tsx", import.meta.url), "utf8"),
              readFile(new URL("../src/components/app-sidebar-overview.tsx", import.meta.url), "utf8"),
            ]);
            assert.ok((controller.match(/React\\.useDeferredValue\\(query\\)/g) ?? []).length >= 2);
            assert.match(primary, /const deferredQuery = React\\.useDeferredValue\\(query\\)/);
            assert.match(content, /const deferredQuery = React\\.useDeferredValue\\(query\\)/);
            assert.match(content, /const deferredDraft = React\\.useDeferredValue\\(draft\\)/);
            assert.match(content, /<BufferedTextInput[\\s\\S]*inputRef=\\{titleRef\\}[\\s\\S]*onCommit=\\{rename\\}/);
            assert.match(content, /<BufferedTextInput[\\s\\S]*onCommit=\\{\\(value\\) => onRename\\(index, value\\)\\}/);
            for (const legacy of ["Notas atômicas", "Citações", "Páginas", "Tipo de objeto", "Visualização em grafo", "Links de entrada", "Pinned tabs cannot be closed", "Preview content for"]) assert.ok(!controller.includes(legacy), legacy);
            for (const legacy of ["Ordenar seção", "Ordenar manualmente", "Ordenar alfabeticamente"]) assert.ok(!overview.includes(legacy), legacy);
          });

          test("locale and governance contracts remain aligned", async () => {
            for (const locale of ["en", "es", "pt-BR"]) {
              const messages = JSON.parse(await readFile(new URL(`../src/messages/${locale}.json`, import.meta.url), "utf8"));
              assert.ok(messages.workspace.tabs.initialObjectType);
              assert.ok(messages.workspace.tabs.previewContent);
              assert.ok(messages.workspace.tabs.pinnedCloseBlocked);
              assert.ok(messages.workspace.sidebarSections.sort);
            }
            const [gitRule, graphRule, graphDocs, ci] = await Promise.all([
              readFile(new URL("../.agents/rules/git-workflow-rule.md", import.meta.url), "utf8"),
              readFile(new URL("../.agents/rules/graphify.md", import.meta.url), "utf8"),
              readFile(new URL("../docs/GRAPHIFY.md", import.meta.url), "utf8"),
              readFile(new URL("../.github/workflows/ci.yml", import.meta.url), "utf8"),
            ]);
            assert.match(gitRule, /working branch -> dev -> stag -> main/);
            assert.match(graphRule, /Graph maintenance is not guaranteed by CI/);
            assert.match(graphDocs, /current CI workflow does not refresh Graphify automatically/);
            assert.doesNotMatch(ci, /graphify:(?:build|update|status)/);
          });
          ''', encoding="utf-8")

          Path(".github/workflows/one-shot-rules-compliance.yml").unlink()

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify repository
        run: pnpm verify

      - name: Commit verified fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: enforce repository rules compliance"
          git push origin HEAD:dev
