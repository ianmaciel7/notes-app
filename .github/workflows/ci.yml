name: CI

# spec.md §12's manual gate: `pnpm lint && pnpm test && pnpm test:e2e && pnpm
# run build`. `pnpm test:e2e` (Playwright, tests/e2e/) drives that gate's
# webServer array itself (see playwright.config.ts), which starts both the
# Firebase emulators (`pnpm run emulators`, from firebase.json) and `next
# dev`; nothing extra needs to be started here beyond a JRE for the Firestore
# emulator.

on:
  push:
    branches: [main, prototype]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.20.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      # The Firestore emulator (firebase.json) needs a JRE; GitHub-hosted
      # runners don't guarantee one out of the box.
      - name: Set up Java (for the Firestore emulator)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright's Chromium (playwright.config.ts is chromium-only)
        run: pnpm exec playwright install --with-deps chromium

      - name: Lint (biome check src tests)
        run: pnpm lint

      - name: Unit and emulator-backed tests
        run: pnpm exec firebase emulators:exec --only auth,firestore --project demo-recall "pnpm test"

      - name: E2E tests (Firebase emulators + next dev, tests/e2e/)
        run: pnpm test:e2e
        env:
          CI: true

      - name: Production build
        run: pnpm run build

      - name: Upload Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            test-results/
            playwright-report/
          retention-days: 7
          if-no-files-found: ignore
