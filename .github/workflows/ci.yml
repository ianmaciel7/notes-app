name: CI

on:
  pull_request:
    branches:
      - main
      - stag
      - dev
  push:
    branches:
      - main
      - stag
      - dev

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  PNPM_VERSION: "11.20.0"
  GRAPHIFY_VERSION: "0.9.41"

jobs:
  format:
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Verify pnpm version
        run: test "$(pnpm --version)" = "$PNPM_VERSION"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm biome:ci

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Verify pnpm version
        run: test "$(pnpm --version)" = "$PNPM_VERSION"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm biome:ci

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Verify pnpm version
        run: test "$(pnpm --version)" = "$PNPM_VERSION"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Next.js route types
        run: pnpm typegen

      - name: Typecheck
        run: pnpm typecheck

  complexity:
    name: Complexity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs:
      - format
      - lint

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Verify pnpm version
        run: test "$(pnpm --version)" = "$PNPM_VERSION"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check cyclomatic complexity
        run: pnpm complexity

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs:
      - format
      - lint
      - typecheck

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Verify pnpm version
        run: test "$(pnpm --version)" = "$PNPM_VERSION"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build production app
        run: pnpm build

  tests:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs:
      - format
      - lint
      - typecheck

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Verify pnpm version
        run: test "$(pnpm --version)" = "$PNPM_VERSION"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run unit and component tests with coverage
        run: pnpm test:coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore
          retention-days: 7

  graphify:
    name: Graphify
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9

      - name: Install Graphify
        run: uv tool install graphifyy==${{ env.GRAPHIFY_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Validate Graphify freshness and artifacts
        env:
          PYTHONHASHSEED: "0"
        run: |
          graphify --version
          graphify check-update .
          node scripts/check-graphify.mjs

  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()
    needs:
      - format
      - lint
      - complexity
      - typecheck
      - tests
      - build
      - graphify

    steps:
      - name: Check required CI jobs
        env:
          FORMAT_RESULT: ${{ needs.format.result }}
          LINT_RESULT: ${{ needs.lint.result }}
          COMPLEXITY_RESULT: ${{ needs.complexity.result }}
          TYPECHECK_RESULT: ${{ needs.typecheck.result }}
          TESTS_RESULT: ${{ needs.tests.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          GRAPHIFY_RESULT: ${{ needs.graphify.result }}
        run: |
          failed=0

          for check in \
            "Format:$FORMAT_RESULT" \
            "Lint:$LINT_RESULT" \
            "Complexity:$COMPLEXITY_RESULT" \
            "Typecheck:$TYPECHECK_RESULT" \
            "Tests:$TESTS_RESULT" \
            "Build:$BUILD_RESULT" \
            "Graphify:$GRAPHIFY_RESULT"; do
            name="${check%%:*}"
            result="${check#*:}"
            if [ "$result" != "success" ]; then
              echo "::error title=$name failed::$name finished with result '$result'"
              failed=1
            fi
          done

          exit "$failed"
