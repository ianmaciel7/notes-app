name: Apply Space switcher phantom addon fix

on:
  push:
    branches:
      - fix/space-switcher-phantom-addon

permissions:
  contents: write

jobs:
  fix-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.20.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Apply structural fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/components/ui/combobox.tsx')
          text = path.read_text()
          old = '''      <InputGroupAddon align="inline-end">
        {showTrigger && (
          <InputGroupButton
            size="icon-xs"
            variant="ghost"
            render={<ComboboxTrigger />}
            data-slot="input-group-button"
            className="group-has-data-[slot=combobox-clear]/input-group:hidden data-pressed:bg-transparent"
            disabled={disabled}
          />
        )}
        {showClear && <ComboboxClear disabled={disabled} />}
      </InputGroupAddon>
      {children}
'''
          new = '''      {(showTrigger || showClear) && (
        <InputGroupAddon align="inline-end">
          {showTrigger && (
            <InputGroupButton
              size="icon-xs"
              variant="ghost"
              render={<ComboboxTrigger />}
              data-slot="input-group-button"
              className="group-has-data-[slot=combobox-clear]/input-group:hidden data-pressed:bg-transparent"
              disabled={disabled}
            />
          )}
          {showClear && <ComboboxClear disabled={disabled} />}
        </InputGroupAddon>
      )}
      {children}
'''
          if old not in text:
              raise SystemExit('Expected ComboboxInput block not found')
          path.write_text(text.replace(old, new, 1))
          PY
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Run regression
        shell: bash
        run: |
          pnpm dev > /tmp/notes-app-next.log 2>&1 &
          for i in {1..60}; do
            if curl --fail --silent http://localhost:3000 >/dev/null; then
              break
            fi
            sleep 1
          done
          pnpm exec playwright test tests/space-switcher-phantom-addon.spec.ts tests/space-switcher-clear-button.spec.ts --reporter=line
      - run: pnpm lint
      - name: Commit verified fix and remove temporary workflows
        shell: bash
        run: |
          rm -f .github/workflows/verify-space-switcher-phantom-addon.yml
          rm -f .github/workflows/apply-space-switcher-phantom-addon-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/ui/combobox.tsx tests/space-switcher-phantom-addon.spec.ts .github/workflows
          git commit -m "fix: remove phantom Space switcher addon"
          git push origin HEAD:fix/space-switcher-phantom-addon
