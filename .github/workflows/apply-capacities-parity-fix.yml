name: Apply Capacities parity fix

on:
  push:
    branches:
      - 868hpfrkz-implement-all-pending-openspecs

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Apply parity fix
        run: node scripts/apply-capacities-parity-fix.mjs

      - name: Remove staging helpers
        run: |
          rm -f scripts/apply-capacities-parity-fix.mjs
          rm -f .github/workflows/apply-capacities-parity-fix.yml

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.20.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify repository
        run: pnpm verify

      - name: Commit and push
        run: |
          git config user.name 'Ian Maciel'
          git config user.email 'ianmaciel76@gmail.com'
          git add -A
          git commit -m 'fix: align Capacities workspace parity'
          git push origin HEAD:868hpfrkz-implement-all-pending-openspecs
