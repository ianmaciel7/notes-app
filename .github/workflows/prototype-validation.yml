name: Prototype Validation

on:
  push:
    branches:
      - prototype

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.20.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm lint
      - run: pnpm exec firebase emulators:exec --only auth,firestore --project demo-recall "pnpm test"
      - run: pnpm test:e2e
        env:
          CI: true
      - run: pnpm run build
