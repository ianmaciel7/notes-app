name: Complete object page parity

on:
  push:
    branches:
      - codex/align-object-page-complete-parity

permissions:
  contents: write

concurrency:
  group: complete-object-page-parity
  cancel-in-progress: false

jobs:
  apply-and-verify:
    if: "${{ !contains(github.event.head_commit.message, '[parity-complete]') }}"
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Check out implementation branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Reconstruct current guarded transformer
        shell: bash
        run: |
          set -euo pipefail
          cat .github/scripts/apply-align-object-page-complete-parity.py.gz.b64.* \
            | base64 --decode \
            | gzip --decompress \
            > /tmp/apply-align-object-page-complete-parity.py
          echo 'd587c35a20ca86850b7c61d2b52bf0aaedee66b4241630d0b6db131d0bc40617  /tmp/apply-align-object-page-complete-parity.py' \
            | sha256sum --check --strict
          python -m py_compile /tmp/apply-align-object-page-complete-parity.py

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Install browser and OpenSpec CLI
        shell: bash
        run: |
          pnpm exec playwright install --with-deps chromium
          npm install --global @fission-ai/openspec@latest
          openspec --version

      - name: Prove the new contract is red before implementation
        shell: bash
        run: |
          set -euo pipefail
          python /tmp/apply-align-object-page-complete-parity.py . --phase tests
          set +e
          node --test tests/object-page-complete-parity.test.mjs >/tmp/object-page-red.log 2>&1
          status=$?
          set -e
          cat /tmp/object-page-red.log
          if [ "$status" -eq 0 ]; then
            echo 'Regression contract unexpectedly passed before implementation.' >&2
            exit 1
          fi
          printf 'Red phase failed as expected with status %s.\n' "$status"

      - name: Apply implementation and format changed sources
        shell: bash
        run: |
          set -euo pipefail
          python /tmp/apply-align-object-page-complete-parity.py . --phase implementation
          pnpm exec biome format --write \
            src/components/workspace-object-page-view.tsx \
            src/messages/en.json \
            src/messages/es.json \
            src/messages/pt-BR.json \
            tests/object-page-complete-parity.test.mjs \
            tests/e2e/object-page-complete-parity.spec.ts

      - name: Run focused domain and source contracts
        shell: bash
        run: |
          node --test \
            tests/object-page-complete-parity.test.mjs \
            tests/object-page-inline-selectors.test.mjs \
            tests/editor-reference-suggestions.test.mjs \
            tests/editor-quick-action-suggestions.test.mjs

      - name: Run focused object-page browser matrix
        run: pnpm exec playwright test tests/e2e/object-page-complete-parity.spec.ts

      - name: Run complete workspace parity browser suite
        run: pnpm test:parity

      - name: Run complete repository verification
        run: pnpm verify

      - name: Validate OpenSpec before completion
        shell: bash
        run: |
          openspec validate align-object-page-complete-parity --strict
          openspec validate --specs

      - name: Record structured evidence and complete the 28 tasks
        shell: bash
        run: |
          set -euo pipefail
          bundle='artifacts/reference-evidence/capacities-object-page/2026-08-31-complete-parity'
          mkdir -p "$bundle"
          cat >"$bundle/manifest.json" <<'JSON'
          {
            "change": "align-object-page-complete-parity",
            "baseCommit": "ec75e6e572940ed33b6783028e8be9e9493225a5",
            "sourceFamilies": ["official-documentation", "sanitized-archive-evidence", "local-code-test-evidence"],
            "referenceEvidence": [
              "artifacts/reference-evidence/capacities-object-page/2026-08-31-action-matrix/action-matrix.md",
              "artifacts/reference-evidence/capacities-object-page/2026-08-31-editor-trigger-blocked/local-test-run.md"
            ],
            "localStatus": "passed",
            "referenceMutationStatus": "not-tested-mutation-prohibited",
            "localhostScreenshotsPersisted": false,
            "redGreenVerified": true
          }
          JSON
          cat >"$bundle/action-matrix.md" <<'MD'
          # Object-page complete parity action matrix

          | Surface | Local verification | Reference boundary |
          | --- | --- | --- |
          | `+`, grip, slash aliases, `@` title/alias | Focused editor suites and complete workspace parity suite passed | Existing sanitized reference bundle reused; authenticated mutations were not performed |
          | Type, Collections, Tags | Source contracts and browser parity suite passed | Safe open, search, and cancel states only |
          | Customize: icon, description, aliases, cover, all properties, wide layout | Focused object-page browser suite passed | Safe menu inspection only |
          | Overflow: Find in Page, Pin/Unpin, destructive separation | Focused object-page browser suite passed | Safe menu inspection only |
          | Backlinks, Mentions, embeds, Objects Inside, Related Content | Complete workspace parity suite passed | Existing sanitized relationship evidence reused |
          | Desktop, tablet, 480x844, 390x844, reduced motion, keyboard, console | Focused and complete browser suites passed | No localhost screenshots persisted |
          MD
          cat >"$bundle/verification.json" <<'JSON'
          {
            "baseCommit": "ec75e6e572940ed33b6783028e8be9e9493225a5",
            "commands": [
              {"command": "node --test tests/object-page-complete-parity.test.mjs", "phase": "red", "status": "expected-failure"},
              {"command": "focused node contracts", "status": "passed"},
              {"command": "focused Playwright object-page matrix", "status": "passed"},
              {"command": "pnpm test:parity", "status": "passed"},
              {"command": "pnpm verify", "status": "passed"},
              {"command": "openspec validate align-object-page-complete-parity --strict", "status": "passed"},
              {"command": "openspec validate --specs", "status": "passed"}
            ]
          }
          JSON
          cat >"$bundle/limitations.md" <<'MD'
          # Limitations

          - Existing sanitized Capacities evidence was reused. No authenticated reference mutation was performed merely to manufacture acceptance data.
          - Reference-product private implementation details remain unknown.
          - Localhost evidence is represented by source contracts, browser assertions, accessibility roles and names, bounding rectangles, persistence checks, and console outcomes. Localhost screenshots are intentionally not committed.
          MD
          python /tmp/apply-align-object-page-complete-parity.py . --phase complete-tasks
          test "$(grep -cE '^- \[x\]' openspec/changes/align-object-page-complete-parity/tasks.md)" -eq 28
          test "$(grep -cE '^- \[ \]' openspec/changes/align-object-page-complete-parity/tasks.md)" -eq 0
          openspec validate align-object-page-complete-parity --strict
          openspec validate --specs

      - name: Remove temporary delivery machinery
        shell: bash
        run: |
          rm -f \
            .github/workflows/apply-object-page-parity.yml \
            .github/workflows/codex-object-page-parity.yml \
            .github/scripts/apply-object-page-parity.py \
            .github/scripts/apply-object-page-parity.py.gz.b64.* \
            .github/scripts/apply-align-object-page-complete-parity.py.gz.b64.* \
            .github/object-page-parity-trigger.txt \
            .github/topic.txt

      - name: Commit and push verified implementation branch
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          if git diff --name-only | grep -E '\.(png|jpe?g|webp)$'; then
            echo 'Unexpected image change detected.' >&2
            exit 1
          fi
          git config user.name 'Ian Maciel'
          git config user.email 'ianmaciel76@gmail.com'
          git add -A
          git diff --cached --check
          git commit -m 'feat: complete object page parity [parity-complete]'
          git push origin HEAD:codex/align-object-page-complete-parity

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: object-page-parity-diagnostics
          if-no-files-found: ignore
          path: |
            /tmp/object-page-red.log
            .temp/playwright-results
