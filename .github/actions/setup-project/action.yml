name: Setup project toolchain
description: Install the repository-pinned pnpm and Node.js runtime, then restore dependencies.

runs:
  using: composite
  steps:
    - name: Set up pnpm and Node.js
      uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
      with:
        cache: true
        install: false
    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
