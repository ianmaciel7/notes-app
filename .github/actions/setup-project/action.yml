name: Setup project toolchain
description: Install repository-pinned pnpm and Node.js, restore the pnpm store, and install from the committed lockfile.

runs:
  using: composite
  steps:
    - name: Set up Java 21
      uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
      with:
        distribution: temurin
        java-version: "21"
    - name: Set up pnpm, Node.js, cache, and dependencies
      uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
      with:
        cache: true
        require-lockfile: true
