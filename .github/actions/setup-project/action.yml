name: Setup project toolchain
description: Install repository-pinned pnpm and Node.js, restore the pnpm store, and install from the committed lockfile.

runs:
  using: composite
  steps:
    - name: Set up pnpm, Node.js, cache, and dependencies
      uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
      with:
        cache: true
        require-lockfile: true
