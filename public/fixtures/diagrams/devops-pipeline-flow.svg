<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="100%" height="100%" className="w-full h-auto select-none">
  <defs>
    <linearGradient id="pipe-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1000" height="600" fill="url(#pipe-grad)" rx="12" />

  <!-- Connector Line -->
  <line x1="190" y1="210" x2="870" y2="210" stroke="#cbd5e1" stroke-width="4" />

  <!-- Stage 1: Commit & Lint (x=100, y=120, w=180, h=180) -> [10, 20, 18, 30] -->
  <g transform="translate(100, 120)">
    <rect width="180" height="180" rx="8" fill="#3b82f6" fill-opacity="0.1" stroke="#2563eb" stroke-width="2" />
    <text x="90" y="70" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle" fill="#1e3a8a">1. Checkout &amp; Lint</text>
    <text x="90" y="100" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle" fill="#475569">Code formatting</text>
    <text x="90" y="125" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle" fill="#475569">Unit tests &amp; syntax</text>
  </g>

  <!-- Stage 2: SAST & SCA Gate (x=320, y=120, w=200, h=180) -> [32, 20, 20, 30] -->
  <g transform="translate(320, 120)">
    <rect width="200" height="180" rx="8" fill="#f59e0b" fill-opacity="0.1" stroke="#d97706" stroke-width="2" />
    <text x="100" y="70" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle" fill="#92400e">2. Security Scan Gate</text>
    <text x="100" y="100" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle" fill="#b45309">SAST (Code Analysis)</text>
    <text x="100" y="125" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle" fill="#b45309">SCA (Dependency CVEs)</text>
  </g>

  <!-- Stage 3: Docker Build & Push (x=560, y=120, w=180, h=180) -> [56, 20, 18, 30] -->
  <g transform="translate(560, 120)">
    <rect width="180" height="180" rx="8" fill="#10b981" fill-opacity="0.1" stroke="#059669" stroke-width="2" />
    <text x="90" y="70" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle" fill="#065f46">3. Build &amp; Push</text>
    <text x="90" y="100" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle" fill="#047857">Container image</text>
    <text x="90" y="125" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle" fill="#047857">Registry tag &amp; sign</text>
  </g>

  <!-- Stage 4: Production Canary Deploy (x=780, y=120, w=180, h=180) -> [78, 20, 18, 30] -->
  <g transform="translate(780, 120)">
    <rect width="180" height="180" rx="8" fill="#8b5cf6" fill-opacity="0.1" stroke="#7c3aed" stroke-width="2" />
    <text x="90" y="70" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle" fill="#5b21b6">4. Prod Canary</text>
    <text x="90" y="100" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle" fill="#6d28d9">Progressive rollout</text>
    <text x="90" y="125" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle" fill="#6d28d9">SLO health verification</text>
  </g>
</svg>
