<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="100%" height="100%" className="w-full h-auto select-none">
  <defs>
    <linearGradient id="cloud-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1000" height="600" fill="url(#cloud-grad)" rx="12" />

  <!-- Multi-Region Geo DNS (x=100, y=60, w=200, h=120) -> [10, 10, 20, 20] -->
  <g transform="translate(100, 60)">
    <rect width="200" height="120" rx="8" fill="#3b82f6" fill-opacity="0.1" stroke="#2563eb" stroke-width="2" />
    <text x="100" y="55" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle" fill="#1e3a8a">Multi-Region Geo DNS</text>
    <text x="100" y="80" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle" fill="#475569">Latency-based Routing</text>
  </g>

  <!-- Flow Line to NAT -->
  <path d="M300 120 L450 210" stroke="#94a3b8" stroke-width="2" stroke-dasharray="4 4" />

  <!-- Single-AZ NAT Gateway (x=450, y=210, w=200, h=150) -> [45, 35, 20, 25] -->
  <g transform="translate(450, 210)">
    <rect width="200" height="150" rx="8" fill="#ef4444" fill-opacity="0.1" stroke="#dc2626" stroke-width="2" />
    <text x="100" y="65" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle" fill="#991b1b">Single-AZ NAT Gateway</text>
    <text x="100" y="90" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle" fill="#b91c1c">(Availability Zone 1)</text>
    <text x="100" y="115" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle" fill="#64748b">Single Point of Failure</text>
  </g>

  <!-- Flow Lines to App and DB -->
  <path d="M500 360 L300 390" stroke="#94a3b8" stroke-width="2" />
  <path d="M600 360 L750 390" stroke="#94a3b8" stroke-width="2" />

  <!-- Multi-AZ Auto Scaling App Fleet (x=150, y=390, w=300, h=150) -> [15, 65, 30, 25] -->
  <g transform="translate(150, 390)">
    <rect width="300" height="150" rx="8" fill="#10b981" fill-opacity="0.1" stroke="#059669" stroke-width="2" />
    <text x="150" y="65" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle" fill="#065f46">Multi-AZ Auto Scaling App Fleet</text>
    <text x="150" y="90" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle" fill="#047857">AZ-a, AZ-b, AZ-c Redundant Pods</text>
  </g>

  <!-- Multi-AZ Clustered Database (x=600, y=390, w=300, h=150) -> [60, 65, 30, 25] -->
  <g transform="translate(600, 390)">
    <rect width="300" height="150" rx="8" fill="#8b5cf6" fill-opacity="0.1" stroke="#7c3aed" stroke-width="2" />
    <text x="150" y="65" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle" fill="#5b21b6">Multi-AZ Clustered Database</text>
    <text x="150" y="90" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle" fill="#6d28d9">Primary + Standby Auto-Failover</text>
  </g>
</svg>
