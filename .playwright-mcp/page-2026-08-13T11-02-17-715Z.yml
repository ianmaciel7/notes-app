          - paragraph [ref=f1e155]: "Para desenvolver agentes localmente no ADK 2.0, o fluxo gira em torno de duas ferramentas:"
          - list [ref=f1e156]:
            - listitem [ref=f1e157]:
              - strong [ref=f1e158]: "Antigravity IDE:"
              - text: Ambiente para escrever, editar e organizar o código do agente.
            - listitem [ref=f1e159]:
              - strong [ref=f1e160]: "agents-cli:"
              - text: usada para criar, testar, avaliar e publicar agentes ADK ou seja operar o ciclo de desenvolvimento do agente.
          - heading [level=2] [ref=f1e280]: Estrategias de desvolvimento
          - list [ref=f1e162]:
            - listitem [ref=f1e163]:
              - strong [ref=f1e164]: "vibe coding:"
              - text: facil prototipação delega implementação foco na arquitetura regras de roteamento e os requisitos de segurança.
            - listitem [ref=f1e165]:
              - strong [ref=f1e166]: "Spec-Driven Development (SDD):"
              - text: A prototipação fica mais difícil no início, porque exige uma especificação arquitetural bem definida. Mas isso facilita a portabilidade do código e evita context fragmentation.
          - generic [ref=f1e167]: specs/expense-agent.md
          - paragraph [ref=f1e168]: Assim, o código pode ser regenerado ou restaurado com mais facilidade. O código se torna descartável; a especificação vira a bússola arquitetural.
          - heading [level=2] [ref=f1e281]: Etapas do Vibe Coding
          - list [ref=f1e170]:
            - listitem [ref=f1e171]:
              - strong [ref=f1e172]: Prompt Arquitetural
              - text: O primeiro prompt que deve ser usado ao criar o ADK, sendo responsável por criar a versão inicial de um agente ou workflow.
            - listitem [ref=f1e173]:
              - strong [ref=f1e174]: "Verificação de discrepacia:"
              - text: peça que ele explique o que construiu antes de prosseguir e compare com seu projeto.
          - generic [ref=f1e175]: "Estou criando um agente de aprovação de despesas em tempo real como um workflow gráfico no ADK 2.0. Um relatório de despesa chega como um evento JSON com os campos: valor, solicitante, categoria, descrição e data. Aplique uma regra: despesas abaixo de US$ 100 devem ser aprovadas automaticamente e instantaneamente, sem envolvimento do LLM."
          - heading [level=2] [ref=f1e282]: Etapas do SSD
          - list [ref=f1e177]:
            - listitem [ref=f1e178]:
              - strong [ref=f1e179]: "criar especificações:"
              - text: mapeie funcionalidades do sistema e seus cenários observáveis.
          - generic [ref=f1e180]: "Feature: Expense Report Processing Scenario: Low-value expense auto-approval Given an expense report with amount: 45 When the agent processes the report Then it auto-approves with no LLM call"
          - heading [level=2] [ref=f1e283]: Fluxo de trabalho antigravidade
          - paragraph [ref=f1e182]: Conecte a especificação, o código, a avaliação e a revisão humana em um fluxo verificável.
          - heading [level=2] [ref=f1e284]: Glosario
          - list [ref=f1e184]:
            - listitem [ref=f1e185]:
              - strong [ref=f1e186]: "edge conditions:"
              - text: casos de borda que podem acontecer no fluxo do agente.
            - listitem [ref=f1e187]:
              - strong [ref=f1e188]: "human-in-the-loop:"
              - text: quando o agente pausa o fluxo e pede participação humana.
            - listitem [ref=f1e189]:
              - strong [ref=f1e190]: "routing outcome:"
              - text: resultado interno que define para qual agente, node, tool ou caminho o fluxo deve seguir.
            - listitem [ref=f1e191]:
              - strong [ref=f1e192]: "boundary conditions:"
