            - listitem [ref=f3e161]:
              - strong [ref=f3e162]: "Spec-Driven Development (SDD):"
              - text: A prototipação fica mais difícil no início, porque exige uma especificação arquitetural bem definida. Mas isso facilita a portabilidade do código e evita context fragmentation.
